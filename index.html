<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compresor Carpetas de GitHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    No se aloja contenido en este sitio. Esta es una herramienta para descargar archivos desde una URL de repositorio GitHub proporcionada por el usuario.
  </header>

  <main class="text-align-center">
    <h1><a href="/">Compresor Carpetas de GitHub</a></h1>

    <form>
      <input id="github-url" name="url" type="url" placeholder="Introduce la URL del directorio de GitHub" autofocus />
    </form>

    <div class="token-group">
      <input type="password" id="github-token" placeholder="Token de GitHub (opcional)" />
      <a href="https://github.com/settings/tokens/new?description=Compresor&scopes=repo" target="_blank">Crear Token</a>
    </div>

    <button id="download-btn">Descargar ZIP</button>

    <div id="status" class="status"></div>

    <div id="progress-container">
      <div id="progress-bar"></div>
      <span id="progress-text">0 / 0 archivos</span>
    </div>

    <div id="file-list">
      <h3>Archivos a comprimir:</h3>
      <ul id="file-names"></ul>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
